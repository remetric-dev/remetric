# e2e/prometheus.yml
global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerting_rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cardinality-bomb
    static_configs:
      - targets: ["cardinality-bomb:8080"]
