# e2e/docker-compose.yml
services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: remetric-e2e-prom
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
    ports:
      - "9090:9090"
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: remetric-e2e-node
    ports:
      - "9100:9100"
  cardinality-bomb:
    build:
      context: ./cardinality-bomb
    container_name: remetric-e2e-bomb
    ports:
      - "8080:8080"
  grafana:
    image: grafana/grafana:11.0.0
    container_name: remetric-e2e-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_LOG_LEVEL: "warn"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
