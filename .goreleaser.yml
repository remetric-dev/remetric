version: 2

project_name: remetric

before:
  hooks:
    - go mod download

builds:
  - id: remetric
    main: ./cmd/remetric
    binary: remetric
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: remetric
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge "

dockers:
  - id: remetric-amd64
    image_templates:
      - "ghcr.io/remetric-dev/remetric:{{ .Version }}-amd64"
      - "ghcr.io/remetric-dev/remetric:latest-amd64"
    dockerfile: Dockerfile.release
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

  - id: remetric-arm64
    image_templates:
      - "ghcr.io/remetric-dev/remetric:{{ .Version }}-arm64"
      - "ghcr.io/remetric-dev/remetric:latest-arm64"
    dockerfile: Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

docker_manifests:
  - name_template: "ghcr.io/remetric-dev/remetric:{{ .Version }}"
    image_templates:
      - "ghcr.io/remetric-dev/remetric:{{ .Version }}-amd64"
      - "ghcr.io/remetric-dev/remetric:{{ .Version }}-arm64"
  - name_template: "ghcr.io/remetric-dev/remetric:latest"
    image_templates:
      - "ghcr.io/remetric-dev/remetric:latest-amd64"
      - "ghcr.io/remetric-dev/remetric:latest-arm64"

homebrew_casks:
  - name: remetric
    repository:
      owner: remetric-dev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://remetric.dev"
    description: "Re-metric your stack - find waste in Prometheus, Grafana & Loki"
    binaries: ["remetric"]
    commit_author:
      name: "remetric-dev-bot"
      email: "noreply@remetric.dev"
    # Strip macOS Gatekeeper quarantine on install so the unsigned binary
    # actually executes. Once we sign + notarize (Apple Developer Program),
    # remove this hook block and let Gatekeeper verify normally.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/remetric"]
          end
    # Publish on every tag, including pre-releases (v0.1.0-rc.N), so we can
    # validate the tap end-to-end before v0.1.0. Switch to `auto` post-v0.1
    # if you want to stop polluting the tap with alphas.
    skip_upload: "false"

release:
  prerelease: auto
  draft: false
