site_name: remetric
site_url: https://remetric.dev/
site_description: Re-metric your stack - find waste in Prometheus, Grafana & Loki
repo_url: https://github.com/remetric-dev/remetric
repo_name: remetric-dev/remetric
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Findings:
    - Overview: findings/index.md
    - Hot label: findings/hot-label.md
    - Unused metric: findings/unused-metric.md
    - Label pattern overly granular: findings/label-pattern-overly-granular.md
    - Never-firing alert: findings/never-firing-alert.md
    - Always-firing alert: findings/always-firing-alert.md
    - Broken panel: findings/broken-panel.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
